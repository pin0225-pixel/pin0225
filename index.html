<!DOCTYPE html>
<html lang="ko">
  <head>
  <meta charset="UTF-8">
  <title>예시1 - 레이아웃을 div로 나누기</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: sans-serif; margin: 0; }

    .header { background: #4a90e2; color: white; padding: 20px; text-align: center;}
    .nav { background: #333; padding: 10px; }
    .nav a { color: white; margin: 0 15px; text-decoration: none; }
    .container { display: flex; }
    .main { background: #f4f4f4; padding: 20px; flex: 3; }
    .sidebar { background: #dcdcdc; padding: 20px; flex: 1; }
    .footer { background: #333; color: white; text-align: center; padding: 10px; }
   </style>
</head>
<body>
  <div class="header">
    <h1>내 웹사이트</h1>
  </div>
  <div class="nav">
    <a href="#">홈</a>
    <a href="#">소개</a>
    <a href="#">연락처</a>
  </div>
  <div class="container">
    <div class="main">
      <h2>본문 내용</h2>
      <p>이 부분에 주요 글이나 이미지가 들어갑니다.</p>
    </div>
    <div class="sidebar">
      <h3>사이드바</h3>
      <p>공지, 광고, 링크 목록 등</p>
    </div>
  </div>
  <div class="footer">
    <p>&copy; 2026 내 웹사이트</p>
  </div>
</body>
</html>
